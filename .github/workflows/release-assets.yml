name: release-assets

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            build_command: build:linux
          - os: macos-latest
            platform: mac
            build_command: build:mac
          - os: windows-latest
            platform: win
            build_command: build:win
    env:
      VITE_GITEE_APP_TOKEN: ${{ secrets.VITE_GITEE_APP_TOKEN }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install Dependencies
        run: pnpm install

      - name: Build ${{ matrix.platform }}
        run: pnpm ${{ matrix.build_command }}

      # electron-builder normalises the arch differently per package format:
      # dmg/exe/zip use x64, deb uses amd64, AppImage uses x86_64.
      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: escrcpy-${{ matrix.platform }}-x64
          if-no-files-found: warn
          retention-days: 90
          path: |
            desktop/dist-release/*-x64.*
            desktop/dist-release/*-amd64.*
            desktop/dist-release/*-x86_64.*

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: escrcpy-${{ matrix.platform }}-arm64
          if-no-files-found: warn
          retention-days: 90
          path: |
            desktop/dist-release/*-arm64.*

      # NSIS also emits a combined installer with no arch suffix, which the two
      # globs above would drop. Kept separately rather than silently discarded.
      - name: Upload multi-arch installers
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: escrcpy-win-multiarch
          if-no-files-found: warn
          retention-days: 90
          path: |
            desktop/dist-release/*-win-setup.*
            desktop/dist-release/*-win-portable.*

      # Only publish a Release for tag pushes. On workflow_dispatch the ref is a
      # branch, which would otherwise be turned into a tag name for the release.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            desktop/dist-release/*.exe
            desktop/dist-release/*.zip
            desktop/dist-release/*.dmg
            desktop/dist-release/*.AppImage
            desktop/dist-release/*.flatpak
            desktop/dist-release/*.snap
            desktop/dist-release/*.deb
            desktop/dist-release/*.rpm
            desktop/dist-release/*.tar.gz
            desktop/dist-release/*.blockmap
            desktop/dist-release/latest*.yml